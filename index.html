<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PersonalSocialLinks</title>
    <link rel="stylesheet" href="main.CSS" type="text/CSS" />
  </head>

  <div class="container">
    <div class="card">
      <div class="card-content">
        <div class="image-container">
          <img
            src="Captura desde 2025-07-21 17-28-59.png"
            alt="Card image"
            class="card-img"
          />
        </div>
        <div class="personalInformation-container">
          <p class="name">Herbert L. Navarro</p>
          <p class="country">Havana, Cuba</p>
          <p class="info">"Front-end developer and guitarrist."</p>
        </div>
        <div class="social-container">
          <div class="social-card">
            <div class="social-item">GitHub</div>
          </div>
          <div class="social-card">
            <div class="social-item">Youtube</div>
          </div>
          <div class="social-card">
            <div class="social-item">Instagram</div>
          </div>
          <div class="social-card">
            <div class="social-item">Twitch</div>
          </div>
          <div class="social-card">
            <div class="social-item">Facebook</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</html>
